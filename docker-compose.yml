# ---------------------------------------------------------------------------
# Hotel MDJ: monolito Django + microservicio Flask detras de Nginx.
#
# Comandos basicos (desde la carpeta del proyecto):
#   docker compose up --build        construye las imagenes y levanta todo
#   docker compose up -d --build     lo mismo, pero en segundo plano
#   docker compose logs -f           ver los logs de todos los servicios
#   docker compose down              detener y borrar los contenedores
#   docker compose down -v           ... y ademas borrar la base de datos
#
# Luego abre http://localhost en el navegador.
#
# Solo Nginx publica un puerto hacia tu PC. Django y Flask viven en la red
# interna de Docker y solo se llega a ellos pasando por Nginx.
# ---------------------------------------------------------------------------

services:

  # --- Monolito legacy (Django + SQLite) -----------------------------------
  django_web:
    build: .                          # usa el Dockerfile de la raiz
    container_name: hotelmdj_django
    environment:
      # Nombres con los que se puede llegar a Django (ver hotelMDJ/settings.py).
      ALLOWED_HOSTS: "localhost,127.0.0.1,django_web"
      # El archivo SQLite vive dentro del volumen montado mas abajo.
      SQLITE_PATH: "/app/data/db.sqlite3"
      # Para una clave propia crea un archivo .env con SECRET_KEY=... (ver .env.example).
      SECRET_KEY: "${SECRET_KEY:-django-insecure-docker-development-only}"
    volumes:
      # "sqlite_data" es un volumen de Docker: los datos sobreviven aunque el
      # contenedor se borre. Se monta en la carpeta donde Django guarda SQLite.
      - sqlite_data:/app/data
    expose:
      - "8000"                        # visible solo dentro de la red de Docker
    restart: unless-stopped

  # --- Microservicio nuevo (Flask, sin base de datos) ----------------------
  pricing_service:
    build: ./pricing_service          # usa pricing_service/Dockerfile
    container_name: hotelmdj_pricing
    environment:
      # Reglas de negocio configurables sin tocar el codigo.
      TAX_RATE: "0.19"
      TIME_ZONE: "America/Bogota"
    expose:
      - "5000"                        # visible solo dentro de la red de Docker
    restart: unless-stopped

  # --- Puerta de entrada (Nginx) --------------------------------------------
  nginx:
    image: nginx:1.30-alpine
    container_name: hotelmdj_nginx
    ports:
      # "PUERTO_EN_TU_PC:PUERTO_EN_EL_CONTENEDOR".
      # Si el 80 ya esta ocupado en tu PC, cambia a "8080:80" y usa http://localhost:8080
      - "80:80"
    volumes:
      # Reemplaza la configuracion por defecto de Nginx con la nuestra.
      # ":ro" = solo lectura: el contenedor no puede modificar el archivo.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # Nginx arranca despues de estos dos, porque su configuracion los nombra.
      - django_web
      - pricing_service
    restart: unless-stopped

volumes:
  sqlite_data:
