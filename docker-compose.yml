# ---------------------------------------------------------------------------
# Hotel MDJ: Django monolith + Flask microservice behind Nginx.
#
#   docker compose up --build       build the images and start everything
#   docker compose up -d --build    same, in the background
#   docker compose logs -f          follow the logs of every service
#   docker compose down             stop and remove the containers
#   docker compose down -v          ...and also delete the database volume
#
# Then open http://localhost. Only Nginx publishes a port; Django and Flask
# are reachable only through it, inside Docker's internal network.
# ---------------------------------------------------------------------------

services:

  # --- Legacy monolith (Django + SQLite) -----------------------------------
  django_web:
    build: .                          # root Dockerfile
    container_name: hotelmdj_django
    environment:
      # Host names Django answers to (see hotelMDJ/settings.py).
      ALLOWED_HOSTS: "localhost,127.0.0.1,django_web"
      # The SQLite file lives inside the volume mounted below.
      SQLITE_PATH: "/app/data/db.sqlite3"
      # Set your own key in a .env file (see .env.example).
      SECRET_KEY: "${SECRET_KEY:-django-insecure-docker-development-only}"
    volumes:
      # Named volume: the data survives when the container is removed.
      - sqlite_data:/app/data
    expose:
      - "8000"                        # internal network only
    restart: unless-stopped

  # --- New microservice (Flask, no database) -------------------------------
  pricing_service:
    build: ./pricing_service          # pricing_service/Dockerfile
    container_name: hotelmdj_pricing
    environment:
      # Business settings, changeable without touching the code.
      TAX_RATE: "0.19"
      TIME_ZONE: "America/Bogota"
    expose:
      - "5000"                        # internal network only
    restart: unless-stopped

  # --- Entry point (Nginx) --------------------------------------------------
  nginx:
    image: nginx:1.30-alpine
    container_name: hotelmdj_nginx
    ports:
      # "HOST_PORT:CONTAINER_PORT". If port 80 is busy, use "8080:80"
      # and open http://localhost:8080
      - "80:80"
    volumes:
      # Replace Nginx's default site with ours (":ro" = read-only).
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # Nginx starts after the services its config points to.
      - django_web
      - pricing_service
    restart: unless-stopped

volumes:
  sqlite_data:
