# ---------------------------------------------------------------------------
# Hotel MDJ: Django monolith + Flask microservices behind Nginx, with
# PostgreSQL as database, Redis as message broker and a Celery worker for
# background tasks.
#
#   docker compose up --build       build the images and start everything
#   docker compose up -d --build    same, in the background
#   docker compose logs -f          follow the logs of every service
#   docker compose down             stop and remove the containers
#   docker compose down -v          ...and also delete the data volumes
#
# Then open http://localhost. Only Nginx publishes a port; everything else is
# reachable only inside Docker's internal network.
#
# Secrets (SECRET_KEY, INTERNAL_API_TOKEN, *_PASSWORD) are read from a .env
# file next to this one; see .env.example. The defaults below are for local
# development only.
# ---------------------------------------------------------------------------

# Settings shared by Django and the Celery worker (same code, same database).
x-django-env: &django-env
  SECRET_KEY: "${SECRET_KEY:-django-insecure-docker-development-only}"
  POSTGRES_HOST: "postgres"
  POSTGRES_DB: "hotelmdj"
  POSTGRES_USER: "hotelmdj"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-hotelmdj-dev-password}"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  NOTIFIER_DELIVERY_TYPE: "HTTP"
  NOTIFICATION_SERVICE_URL: "http://nginx/api/v2/notificaciones/"
  INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-docker-development-internal-token}"

services:

  # --- Database (PostgreSQL) -------------------------------------------------
  # One server, one database per owner of data (postgres/init/01-databases.sh):
  # hotelmdj (Django), payments, notifications. The catalog reads hotelmdj
  # with a read-only role.
  postgres:
    image: postgres:17-alpine
    container_name: hotelmdj_postgres
    environment:
      POSTGRES_DB: "hotelmdj"
      POSTGRES_USER: "hotelmdj"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-hotelmdj-dev-password}"
      # Read by the init script to create the other roles.
      CATALOG_DB_PASSWORD: "${CATALOG_DB_PASSWORD:-catalog-dev-password}"
      PAYMENTS_DB_PASSWORD: "${PAYMENTS_DB_PASSWORD:-payments-dev-password}"
      NOTIFICATIONS_DB_PASSWORD: "${NOTIFICATIONS_DB_PASSWORD:-notifications-dev-password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only when postgres_data is empty (first start).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelmdj -d hotelmdj"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- Message broker (Redis) -------------------------------------------------
  # Queue between Django and the Celery worker; also stores task results.
  redis:
    image: redis:8-alpine
    container_name: hotelmdj_redis
    # Append-only file: queued tasks survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- Legacy monolith (Django) ----------------------------------------------
  django_web:
    build: .                          # root Dockerfile
    container_name: hotelmdj_django
    environment:
      <<: *django-env
      # Host names Django answers to (see hotelMDJ/settings.py). Add the
      # public IP of the server through ALLOWED_HOSTS in .env.
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,django_web}"
      # Strangled features: Django calls the Flask services through Nginx.
      PAYMENT_GATEWAY_TYPE: "HTTP"
      PAYMENT_SERVICE_URL: "http://nginx/api/v2/pagos/"
      CATALOG_SERVICE_URL: "http://nginx/api/v1/"
      MEETU2_API_URL: "${MEETU2_API_URL:-http://184.193.170.74/api/v1/integracion/experiencias-publicas/}"
      API_COLOMBIA_URL: "${API_COLOMBIA_URL:-https://api-colombia.com/api/v1/TouristicAttraction}"
      MEDIA_ROOT: "/app/media"
      # Confirmations are queued in Redis; the Celery worker delivers them
      # to the notification microservice.
      NOTIFIER_TYPE: "CELERY"
    expose:
      - "8000"                        # internal network only
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Background worker (Celery) ---------------------------------------------
  # Same image and settings as Django; consumes the tasks queued in Redis
  # (notifications with retries, occupancy reports).
  celery_worker:
    build: .
    container_name: hotelmdj_celery
    command: ["celery", "-A", "hotelMDJ", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      <<: *django-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Microservice: pricing (Flask, no database) --------------------------
  pricing_service:
    build: ./pricing_service
    container_name: hotelmdj_pricing
    environment:
      TAX_RATE: "0.19"
      TIME_ZONE: "America/Bogota"
    expose:
      - "5000"
    restart: unless-stopped

  # --- Microservice: catalog and availability (Flask) ----------------------
  # Reads the monolith's database with the read-only role catalog_reader
  # (transitional shared database of the Strangler Pattern).
  catalog_service:
    build: ./catalog_service
    container_name: hotelmdj_catalog
    environment:
      DATABASE_URL: "postgresql://catalog_reader:${CATALOG_DB_PASSWORD:-catalog-dev-password}@postgres:5432/hotelmdj"
      MEDIA_BASE_URL: "http://nginx/media/"
    expose:
      - "5001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- Microservice: payments (Flask, own database) -------------------------
  payment_service:
    build: ./payment_service
    container_name: hotelmdj_payments
    environment:
      DATABASE_URL: "postgresql://payments:${PAYMENTS_DB_PASSWORD:-payments-dev-password}@postgres:5432/payments"
      PAYMENT_PROVIDER: "SIMULATED"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-docker-development-internal-token}"
    expose:
      - "5002"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- Microservice: notifications (Flask, own database) --------------------
  notification_service:
    build: ./notification_service
    container_name: hotelmdj_notifications
    environment:
      DATABASE_URL: "postgresql://notifications:${NOTIFICATIONS_DB_PASSWORD:-notifications-dev-password}@postgres:5432/notifications"
      # CONSOLE prints to the logs; EMAIL needs SMTP_* (see config.py).
      NOTIFICATION_CHANNEL: "CONSOLE"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-docker-development-internal-token}"
    expose:
      - "5003"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- Entry point / API Gateway (Nginx) ------------------------------------
  nginx:
    image: nginx:1.30-alpine
    container_name: hotelmdj_nginx
    ports:
      # "HOST_PORT:CONTAINER_PORT". If port 80 is busy, use "8080:80"
      # and open http://localhost:8080
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - django_web
      - pricing_service
      - catalog_service
      - payment_service
      - notification_service
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
