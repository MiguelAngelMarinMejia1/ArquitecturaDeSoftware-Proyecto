# ---------------------------------------------------------------------------
# Nginx: puerta de entrada unica del sistema (Strangler Pattern).
#
# El cliente solo conoce http://localhost. Nginx mira la URL de cada peticion
# y decide a que servicio enviarla:
#
#   /api/v2/cotizacion/...  ->  microservicio Flask   (funcionalidad estrangulada)
#   /api/v1/...             ->  monolito Django       (API legacy)
#   todo lo demas (/)       ->  monolito Django       (sitio web, admin, static)
#
# docker-compose.yml monta este archivo en /etc/nginx/conf.d/default.conf.
# Si cambias algo aqui: docker compose restart nginx
# ---------------------------------------------------------------------------

# "upstream" le pone un nombre a cada servicio de destino.
# django_web y pricing_service son los NOMBRES DE LOS SERVICIOS en
# docker-compose.yml: dentro de la red de Docker funcionan como nombres de host.
upstream django_backend {
    server django_web:8000;
}

upstream pricing_backend {
    server pricing_service:5000;
}

server {
    listen 80;
    server_name localhost;

    # Tamano maximo del cuerpo de una peticion (formularios, JSON).
    client_max_body_size 1m;

    # Cabeceras que se reenvian a Django y a Flask en cada peticion:
    #   Host              el host y puerto originales (Django lo valida con
    #                     ALLOWED_HOSTS y lo usa para la proteccion CSRF)
    #   X-Real-IP         la IP real del cliente, no la de Nginx
    #   X-Forwarded-For   la cadena de IPs por las que paso la peticion
    #   X-Forwarded-Proto si el cliente uso http o https
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Microservicio nuevo: cotizacion (Flask) ---------------------------
    # Captura /api/v2/cotizacion, /api/v2/cotizacion/ y /api/v2/cotizacion/health/.
    # proxy_pass SIN ruta al final: Flask recibe la URL completa tal cual,
    # por eso las rutas de Flask tambien empiezan por /api/v2/cotizacion.
    location /api/v2/cotizacion {
        proxy_pass http://pricing_backend;
    }

    # --- Monolito legacy: API v1 (Django) ----------------------------------
    location /api/v1/ {
        proxy_pass http://django_backend;
    }

    # --- Monolito legacy: sitio web, /admin/ y archivos estaticos (Django) --
    # Nginx elige siempre la "location" con el prefijo mas largo que coincida,
    # asi que esta solo atiende lo que no capturaron las anteriores.
    location / {
        proxy_pass http://django_backend;
    }

    # Para estrangular otra funcionalidad en el futuro basta con:
    #   1. crear su servicio en docker-compose.yml
    #   2. agregar su bloque "upstream" arriba
    #   3. agregar aqui una "location /api/v2/<funcionalidad>" que apunte a el
}
