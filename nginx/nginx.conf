# ---------------------------------------------------------------------------
# Nginx: single entry point of the system (Strangler Pattern).
#
#   /api/v2/cotizacion/...  ->  Flask microservice   (strangled feature)
#   /api/v1/...             ->  Django monolith      (legacy API)
#   everything else (/)     ->  Django monolith      (website, admin, static)
#
# Mounted by docker-compose.yml as /etc/nginx/conf.d/default.conf.
# After editing: docker compose restart nginx
# ---------------------------------------------------------------------------

# Each upstream names a target service. django_web and pricing_service are the
# service names in docker-compose.yml, which Docker resolves as host names.
upstream django_backend {
    server django_web:8000;
}

upstream pricing_backend {
    server pricing_service:5000;
}

server {
    listen 80;
    server_name localhost;

    # Max request body size (forms, JSON).
    client_max_body_size 1m;

    # Headers forwarded to Django and Flask:
    #   Host              original host and port (Django checks it for
    #                     ALLOWED_HOSTS and CSRF)
    #   X-Real-IP         real client IP instead of Nginx's
    #   X-Forwarded-For   chain of IPs the request went through
    #   X-Forwarded-Proto http or https
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- New microservice: pricing (Flask) ---------------------------------
    # No path after proxy_pass, so Flask receives the full URL unchanged;
    # that is why the Flask routes also start with /api/v2/cotizacion.
    location /api/v2/cotizacion {
        proxy_pass http://pricing_backend;
    }

    # --- Legacy monolith: API v1 (Django) ----------------------------------
    location /api/v1/ {
        proxy_pass http://django_backend;
    }

    # --- Legacy monolith: website, /admin/ and static files (Django) -------
    # Nginx picks the longest matching prefix, so this only gets what the
    # blocks above did not match.
    location / {
        proxy_pass http://django_backend;
    }

    # To strangle another feature:
    #   1. add its service to docker-compose.yml
    #   2. add an "upstream" block for it above
    #   3. add a "location /api/v2/<feature>" here pointing to it
}
