# ---------------------------------------------------------------------------
# Nginx: single entry point of the system (Strangler Pattern).
#
#   /api/v1/rooms/available/     ->  Flask catalog        (strangled from Django)
#   /api/v2/catalogo/...         ->  Flask catalog        (health)
#   /api/v2/cotizacion/...       ->  Flask pricing
#   /api/v2/pagos/...            ->  Flask payments       (called by Django)
#   /api/v2/notificaciones/...   ->  Flask notifications  (called by Django)
#   /api/v1/... (rest)           ->  Django monolith      (reservations, lookup)
#   everything else (/)          ->  Django monolith      (website, admin, static)
#
# Mounted by docker-compose.yml as /etc/nginx/conf.d/default.conf.
# After editing: docker compose restart nginx
# ---------------------------------------------------------------------------

# Docker's embedded DNS. With `resolve` in each upstream, Nginx follows a
# container to its new IP after it is recreated instead of keeping the old one.
resolver 127.0.0.11 valid=10s ipv6=off;

# Each upstream names a target service. The names are the service names in
# docker-compose.yml, which Docker resolves as host names.
upstream django_backend {
    zone django_backend 64k;
    server django_web:8000 resolve;
}

upstream pricing_backend {
    zone pricing_backend 64k;
    server pricing_service:5000 resolve;
}

upstream catalog_backend {
    zone catalog_backend 64k;
    server catalog_service:5001 resolve;
}

upstream payment_backend {
    zone payment_backend 64k;
    server payment_service:5002 resolve;
}

upstream notification_backend {
    zone notification_backend 64k;
    server notification_service:5003 resolve;
}

server {
    listen 80 default_server;
    server_name _;

    # Max request body size (forms, JSON).
    client_max_body_size 1m;

    # Fail fast when a backend is down instead of hanging the client.
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # Headers forwarded to Django and Flask:
    #   Host              original host and port (Django checks it for
    #                     ALLOWED_HOSTS and CSRF)
    #   X-Real-IP         real client IP instead of Nginx's
    #   X-Forwarded-For   chain of IPs the request went through
    #   X-Forwarded-Proto http or https
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # No path after proxy_pass in any block below, so every service receives
    # the full URL unchanged; that is why the Flask routes repeat the prefix.

    # --- Strangled from the monolith: catalog (Flask) ----------------------
    # These URLs used to be answered by Django. Same contract, new backend.
    location ~ ^/api/v1/(rooms|rooms/available)/?$ {
        proxy_pass http://catalog_backend;
    }

    location ~ ^/api/v2/catalogo(/|$) {
        proxy_pass http://catalog_backend;
    }

    # --- Microservice: pricing (Flask) -------------------------------------
    location ~ ^/api/v2/cotizacion(/|$) {
        proxy_pass http://pricing_backend;
    }

    # --- Microservice: payments (Flask) ------------------------------------
    # Django charges reservations through here (HttpPaymentGateway). POST is
    # protected by the X-Internal-Token shared secret.
    location ~ ^/api/v2/pagos(/|$) {
        proxy_pass http://payment_backend;
    }

    # --- Microservice: notifications (Flask) -------------------------------
    # Django publishes confirmations through here (HttpNotifier).
    location ~ ^/api/v2/notificaciones(/|$) {
        proxy_pass http://notification_backend;
    }

    # --- Legacy monolith: rest of API v1 (Django) --------------------------
    location /api/v1/ {
        proxy_pass http://django_backend;
    }

    location /media/ {
        proxy_pass http://django_backend;
    }

    # --- Legacy monolith: website, /admin/ and static files (Django) -------
    # Nginx tries the regex blocks above before falling back to the longest
    # matching prefix, so this only gets what nothing else matched.
    location / {
        proxy_pass http://django_backend;
    }

    # To strangle another feature:
    #   1. add its service to docker-compose.yml
    #   2. add an "upstream" block for it above
    #   3. add a "location" here pointing to it
}
